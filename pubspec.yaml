name: hydra
description: "HYDRA Mobile App - EMAPAT S.A. Water Anomaly Detection"
publish_to: 'none'
version: 2.0.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  connectivity_plus: ^7.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.3
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^1.2.0
  cached_network_image: ^3.4.1
  pdf: ^3.12.0
  printing: ^5.14.3
  speech_to_text: ^7.4.0
  signature: ^6.4.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  freezed: ^2.5.2

flutter:
